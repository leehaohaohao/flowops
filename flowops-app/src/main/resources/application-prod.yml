# ==========================================
#  FlowOps 生产环境配置（Linux Docker 部署）
#  启动: docker run ... --spring.profiles.active=prod
# ==========================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 生产环境日志级别
logging:
  level:
    com.nexa.flowops: INFO
