# ==========================================
#  FlowOps 公共配置（所有环境共享）
# ==========================================
spring:
  profiles:
    active: prod   # 默认生产环境，启动时可用 --spring.profiles.active=dev 切换
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# 服务端口
server:
  port: 8080

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.nexa.flowops.entity,com.nexa.flowops.permission.entity
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: jwt
  jwt-secret-key: ${JWT_SECRET}
  is-stateless: true
  is-log: false
  is-read-cookie: true
  is-write-cookie: true

# Docker 配置
docker:
  host: tcp://localhost:2375
  registry-url: https://index.docker.io/v1/

# 产物存储目录
app:
  storage:
    path: /data/flowops/services
