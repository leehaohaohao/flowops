# ==========================================
#  FlowOps 公共配置（所有环境共享）
# ==========================================
spring:
  profiles:
    active: prod   # 默认生产环境，启动时可用 --spring.profiles.active=dev 切换
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# 服务端口
server:
  port: 8080
  tomcat:
    connection-timeout: 300s
    max-swallow-size: 500MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.nexa.flowops.entity,com.nexa.flowops.permission.entity
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: jwt
  jwt-secret-key: ${JWT_SECRET}
  is-stateless: true
  is-log: false
  is-read-cookie: true
  is-write-cookie: true

# Docker 配置
docker:
  host: tcp://localhost:2375
  registry-url: https://index.docker.io/v1/

# 产物存储目录
app:
  storage:
    path: /data/flowops/services
  logs:
    path: /data/flowops/logs
    max-file-size: 104857600    # 100MB

# Nexa Protocol Master 配置（分布式子节点通信）
nexa:
  master:
    enabled: true
    host: 127.0.0.1
    port: 9090
    heartbeat-timeout: 30s
    heartbeat-check-interval: 5s
    # 产物下载：子节点拉取 volumeDir tar 包用
    # artifact-base-url: 主节点 HTTP 地址（子节点需能访问），env: ARTIFACT_BASE_URL
    # artifact-token: 共享密钥；为空表示内网信任免鉴权（生产建议配置），env: ARTIFACT_TOKEN
    artifact-base-url: ${ARTIFACT_BASE_URL:http://127.0.0.1:8080}
    artifact-token: ${ARTIFACT_TOKEN:}

