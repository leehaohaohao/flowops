<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>运行日志 — <span th:text="${service.name}">服务名</span></h2>
        <div>
            <a class="btn btn-outline-secondary btn-sm" href="/services">返回服务列表</a>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3 mb-3">
        <div class="input-group" style="width:200px;">
            <span class="input-group-text">显示行数</span>
            <select id="tailLines" class="form-select form-select-sm">
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="500" selected>500</option>
                <option value="1000">1000</option>
                <option value="2000">2000</option>
            </select>
        </div>
        <button id="btnLoad" class="btn btn-primary btn-sm" onclick="loadLogs()">加载日志</button>
        <button id="btnFollow" class="btn btn-success btn-sm" onclick="startFollow()">实时跟踪</button>
        <button id="btnStop" class="btn btn-warning btn-sm" onclick="stopFollow()" disabled>停止跟踪</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="clearLog()">清空</button>
        <span id="status" class="text-muted small"></span>
    </div>

    <pre id="logContent"
         style="background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:4px;
                height:calc(100vh - 260px);overflow:auto;font-size:13px;line-height:1.5;
                font-family:'Cascadia Code','Fira Code','Consolas',monospace;">
点击"加载日志"或"实时跟踪"查看容器运行日志
    </pre>

    <script>
    const serviceId = [[${service.id}]];
    let ws = null;

    function setStatus(msg) {
        document.getElementById('status').textContent = msg;
    }

    function appendLine(text) {
        const el = document.getElementById('logContent');
        if (el.textContent === '点击"加载日志"或"实时跟踪"查看容器运行日志\n        ') {
            el.textContent = '';
        }
        el.textContent += text + '\n';
        el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
        const el = document.getElementById('logContent');
        el.textContent = '';
        setStatus('');
    }

    async function loadLogs() {
        stopFollow();
        const tail = document.getElementById('tailLines').value;
        setStatus('加载中...');
        const el = document.getElementById('logContent');
        el.textContent = '';
        try {
            const res = await api('/api/deploy/logs/' + serviceId + '?tail=' + tail);
            if (res.code === 200) {
                el.textContent = res.data;
                el.scrollTop = el.scrollHeight;
                setStatus('加载完成');
            } else {
                el.textContent = '加载失败: ' + res.msg;
                setStatus('');
            }
        } catch (e) {
            el.textContent = '请求失败: ' + e.message;
            setStatus('');
        }
    }

    function startFollow() {
        stopFollow();
        const tail = document.getElementById('tailLines').value;
        setStatus('正在连接...');
        document.getElementById('btnFollow').disabled = true;
        document.getElementById('btnStop').disabled = false;
        document.getElementById('btnLoad').disabled = true;

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + location.host + '/ws/container-logs');

        ws.onopen = () => {
            ws.send(JSON.stringify({serviceId: serviceId, tail: parseInt(tail), follow: true}));
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                switch (data.type) {
                    case 'status':
                        setStatus(data.msg);
                        break;
                    case 'statusLine':
                        setStatus(data.msg);
                        appendLine('--- ' + data.msg + ' ---');
                        break;
                    case 'line':
                        appendLine(data.msg);
                        break;
                    case 'end':
                        setStatus(data.msg);
                        enableFollowBtns();
                        break;
                    case 'error':
                        appendLine('[错误] ' + data.msg);
                        setStatus('错误');
                        enableFollowBtns();
                        break;
                }
            } catch (err) {
                appendLine(e.data);
            }
        };

        ws.onerror = () => {
            setStatus('WebSocket 连接失败');
            enableFollowBtns();
        };

        ws.onclose = () => {
            setStatus('连接已关闭');
            enableFollowBtns();
        };
    }

    function stopFollow() {
        if (ws) {
            ws.close();
            ws = null;
        }
        enableFollowBtns();
    }

    function enableFollowBtns() {
        document.getElementById('btnFollow').disabled = false;
        document.getElementById('btnStop').disabled = true;
        document.getElementById('btnLoad').disabled = false;
    }
    </script>
</th:block>
</html>
