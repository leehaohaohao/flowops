<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <h2>日志查看</h2>
    <div class="mt-4">
        <h5>部署日志列表</h5>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>日志文件</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="logTable"></tbody>
        </table>
    </div>

    <hr>

    <div>
        <h5>实时日志</h5>
        <pre id="logContent" style="background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:4px;max-height:500px;overflow:auto;font-size:13px;">
点击上方日志文件查看内容
        </pre>
    </div>

    <script>
    let ws = null;

    async function loadLogs() {
        const res = await api('/api/logs/list');
        if (res.code === 200 && res.data.length > 0) {
            document.getElementById('logTable').innerHTML = res.data.map(f => `
                <tr>
                    <td>${f}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewLog('${f}')">查看</button>
                        <a class="btn btn-sm btn-secondary" href="/api/logs/content?filename=${f}" download>下载</a>
                    </td>
                </tr>
            `).join('');
        } else {
            document.getElementById('logTable').innerHTML = '<tr><td colspan="2" class="text-muted">暂无日志</td></tr>';
        }
    }

    function viewLog(filename) {
        const logEl = document.getElementById('logContent');
        logEl.textContent = '加载中...';

        // 关闭旧的 WebSocket
        if (ws) {
            ws.close();
            ws = null;
        }

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + location.host + '/ws/logs');

        ws.onopen = () => ws.send(filename);

        ws.onmessage = (e) => {
            // 第一条消息是全量内容，后续是增量追加
            if (logEl.textContent === '加载中...') {
                logEl.textContent = e.data;
            } else {
                logEl.textContent += e.data;
            }
            // 自动滚到底部
            logEl.scrollTop = logEl.scrollHeight;
        };

        ws.onerror = () => {
            logEl.textContent = 'WebSocket 连接失败，请重试';
        };

        ws.onclose = () => {
            // 如果不是主动关闭（切换文件），不做处理
        };
    }

    loadLogs();
    </script>
</th:block>
</html>
