# ==========================================
#  FlowOps 开发环境配置（Windows 本地开发）
#  启动: ./mvnw spring-boot:run
#  或:   java -jar flowops.jar --spring.profiles.active=dev
# ==========================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowops?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# 开发环境日志级别
logging:
  level:
    com.nexa.flowops: DEBUG
