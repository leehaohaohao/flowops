<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<th:block th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>用户管理</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="resetForm()">创建用户</button>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>角色</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>

    <!-- 创建用户弹窗 -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建用户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">角色</label>
                            <select class="form-control" name="role">
                                <option value="user">普通用户</option>
                                <option value="admin">管理员</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    async function loadUsers() {
        const res = await fetch('/api/users/list', {headers: {'Authorization': localStorage.getItem('token')}}).then(r => r.json());
        if (res.code === 200) {
            document.getElementById('userTable').innerHTML = res.data.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.role}</td>
                    <td>${u.createTime || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }
    }

    document.getElementById('userForm').onsubmit = async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const res = await fetch('/api/users/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': localStorage.getItem('token')},
            body: JSON.stringify({username: form.get('username'), password: form.get('password'), role: form.get('role')})
        }).then(r => r.json());
        if (res.code === 200) {
            alert(res.msg);
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            loadUsers();
        } else { alert(res.msg); }
    };

    function resetForm() { document.getElementById('userForm').reset(); }

    async function deleteUser(id) {
        if (!confirm('确认删除该用户？')) return;
        const res = await fetch(`/api/users/${id}`, {method: 'DELETE', headers: {'Authorization': localStorage.getItem('token')}}).then(r => r.json());
        alert(res.msg);
        if (res.code === 200) loadUsers();
    }

    loadUsers();
    </script>
</th:block>
</html>
